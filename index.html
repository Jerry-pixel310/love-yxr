<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>给小羊宝宝的一封信</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  </head>
  <body>
    <form name="ranran-reply" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="ranran-reply" />
      <input name="mood" />
      <textarea name="message"></textarea>
      <textarea name="interactionSummary"></textarea>
      <textarea name="visitInfo"></textarea>
      <textarea name="activityLog"></textarea>
      <input name="submittedAt" />
      <input name="bot-field" />
    </form>
    <form name="ranran-visit-log" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="ranran-visit-log" />
      <input name="visitedAt" />
      <textarea name="visitInfo"></textarea>
      <textarea name="activityLog"></textarea>
      <textarea name="interactionSummary"></textarea>
      <input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
