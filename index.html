<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>给小羊宝宝的一封信</title>
    <link rel="manifest" href="/love-yxr/manifest.json" />
    <meta name="theme-color" content="#ff2f7d" />
    <link rel="apple-touch-icon" href="/love-yxr/icon-192.png" />
    <script type="module" crossorigin src="/love-yxr/assets/index-zK5AgzmO.js"></script>
    <link rel="stylesheet" crossorigin href="/love-yxr/assets/index-DKOqn1Z4.css">
  </head>
  <body>
    <form name="ranran-reply" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="ranran-reply" />
      <input name="mood" />
      <textarea name="message"></textarea>
      <textarea name="interactionSummary"></textarea>
      <textarea name="visitInfo"></textarea>
      <textarea name="activityLog"></textarea>
      <input name="submittedAt" />
      <input name="bot-field" />
    </form>
    <form name="ranran-visit-log" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="ranran-visit-log" />
      <input name="visitedAt" />
      <textarea name="visitInfo"></textarea>
      <textarea name="activityLog"></textarea>
      <textarea name="interactionSummary"></textarea>
      <input name="bot-field" />
    </form>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/love-yxr/sw.js').then((reg) => {
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed') {
                    if (navigator.serviceWorker.controller) {
                      // 发现新版本 Service Worker 在后台安装就绪，直接强载最新资源
                      console.log('检测到网页有了更甜的更新，正在为您刷新载入...');
                      window.location.reload();
                    }
                  }
                };
              }
            };
          });
        });

        // 监听 active 变更
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            window.location.reload();
            refreshing = true;
          }
        });
      }
    </script>
  </body>
</html>
